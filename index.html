<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SM Development | Property Development</title>

    <meta name="description" content="SM Development - Residential and commercial property development, property sales and client services.">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f8fa;
            color: #263238;
            line-height: 1.7;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        img {
            width: 100%;
            display: block;
        }

        button,
        input,
        textarea,
        select {

        .container {

            max-width: 1180px;
            margin: 0 auto;
            padding-left: 25px;
            padding-right: 25px;
        }

        .section {
            padding-top: 90px;
            padding-bottom: 90px;
        }

        .section-label {
            color: #b18a45;
            font-size: 0.78rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            margin-bottom: 12px;
        }

        .section-title {
            color: #003366;
            font-size: clamp(2rem, 4vw, 3rem);
            line-height: 1.2;
            margin-bottom: 18px;
        }

        .section-description {
            max-width: 700px;
            color: #667085;
            font-size: 1rem;
        }

        .section-heading {
            margin-bottom: 45px;
        }

        .btn {
            display: inline-block;
            padding: 13px 25px;
            border: none;
            border-radius: 4px;
            background: #003366;
            color: #ffffff;
            font-size: 0.94rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .btn:hover {
            background: #00264d;
            transform: translateY(-2px);
        }

        .btn-light {
            background: #ffffff;
            color: #003366;
        }

        .btn-light:hover {
            background: #f1f3f5;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 9999;
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
        }

        .navbar {
            min-height: 75px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            color: #003366;
            font-size: 1.45rem;
            font-weight: 800;
            letter-spacing: 1.4px;
        }

        .logo span {
            color: #b18a45;

        .nav-links {

        .nav-links a {

            font-weight: 600;
            transition: color 0.25s ease;

        .nav-links a:hover {
            color: #003366;
        }

        .nav-links .nav-contact {
            padding: 10px 18px;
            color: #ffffff;
            background: #003366;
            border-radius: 4px;
        }

        .nav-links .nav-contact:hover {
            color: #ffffff;
            background: #00264d;
        }

        .mobile-menu-button {
            display: none;
            border: none;
            background: transparent;
            font-size: 1.7rem;
            color: #003366;
            cursor: pointer;
        }

        .mobile-menu {
            display: none;
            background: #ffffff;
            border-top: 1px solid #e5e7eb;
        }

        .mobile-menu.active {
            display: block;
        }

        .mobile-menu a {
            display: block;
            padding: 14px 25px;
            border-bottom: 1px solid #f0f1f3;
            color: #344054;
            font-weight: 600;
        }

            min-height: 680px;

            align-items: center;
            background:

                    rgba(0, 20, 40, 0.80)
                ),
                url("https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=1900&q=85")

        }

        .hero-content {

        .hero .section-label {

        }

        .info-card {

            padding: 32px;
            transition: all 0.25s ease;
        }

        .info-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 18px 40px rgba(0,0,0,0.07);
        }

        .gold-line {
            width: 42px;

            margin-bottom: 22px;
        }

        }

        .info-card p {

            font-size: 0.92rem;
        }

        .projects {

        }

        .project-grid {

            gap: 28px;
        }

        .project-card {

            border: 1px solid #e4e7ec;

            transition: all 0.25s ease;
        }

        .project-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 18px 45px rgba(0,0,0,0.08);
        }

        .project-image {
            height: 320px;
            background-position: center;
            background-size: cover;
        }

            background-image:

        }

        .project-image-two {
            background-image:
                url("https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1300&q=85");
        }

        .project-content {
            padding: 30px;
        }

        .project-type {
            color: #b18a45;
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.2px;
        }

        .project-content h3 {

            font-size: 1.45rem;
            margin: 8px 0 10px;
        }

        .project-content p {
            color: #667085;
            font-size: 0.92rem;
        }
